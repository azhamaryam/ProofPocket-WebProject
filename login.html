
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ProofPocket</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">ProofPocket</a>
            <a href="index.html" class="nav-link">Back to Home</a>
        </div>
    </nav>

    <!-- Login Form -->
    <div class="auth-container">

        <div class="auth-card">

            <h2 class="text-center">Welcome Back!</h2>
            <p class="text-center mb-4">Login to your ProofPocket account.</p>

            <form>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" placeholder="Enter your email">
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="Enter your password">
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label" for="remember">Remember me</label>
                    </div>

                    <a href="#" class="auth-link">Forgot Password?</a>
                </div>

                <button type="button" class="btn btn-primary w-100">Login</button>

            </form>

            <p class="text-center mt-4 mb-0">
                Don't have an account?
                <a href="signup.html" class="auth-link">Sign Up</a>
            </p>

        </div>

    </div>

    <footer class="text-center py-3">
        © 2026 ProofPocket. All rights reserved.
    </footer>

</body>
</html>

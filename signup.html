
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - ProofPocket</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">ProofPocket</a>
            <a href="index.html" class="nav-link">Back to Home</a>
        </div>
    </nav>

    <!-- Signup Form -->
    <div class="auth-container">

        <div class="auth-card">

            <h2 class="text-center">Create Account</h2>
            <p class="text-center mb-4">Get started with ProofPocket.</p>

            <form>

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" placeholder="Enter your full name">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" placeholder="Enter your email">
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="Create a password">
                </div>

                <div class="mb-4">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" placeholder="Confirm your password">
                </div>

                <button type="button" class="btn btn-primary w-100">Create Account</button>

            </form>

            <p class="text-center mt-4 mb-0">
                Already have an account?
                <a href="login.html" class="auth-link">Login</a>
            </p>

        </div>

    </div>

    <footer class="text-center py-3">
        © 2026 ProofPocket. All rights reserved.
    </footer>

</body>
</html>
